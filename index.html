<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rankings">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Racket Rankings</title>
<style>
:root{
  --bg:#f5f6f3;--card:#fff;--ink:#1a2220;--mute:#65706b;--line:#e2e5e0;
  --accent:#1f6f5c;--accent-ink:#fff;--win:#2b78d6;--loss:#e07b2c;--soft:#eef1ed;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121615;--card:#1b2120;--ink:#e8ece9;--mute:#98a39e;--line:#2b3331;
    --accent:#4fb89c;--accent-ink:#0c1512;--win:#5aa0f2;--loss:#f0974d;--soft:#242b29;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
html{-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:6px}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}
nav a{padding:6px 11px;border-radius:8px;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:6px}
nav svg{display:none;width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.on{background:var(--soft);color:var(--ink);font-weight:600;text-decoration:none}
main{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.tile span{color:var(--mute);font-size:12px}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.sm{padding:2px 8px;font-size:13px}
button.danger{color:var(--loss)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row>input,.row>select{width:auto;min-width:140px}
.pills{display:flex;gap:4px}
.pills button{border-radius:99px;padding:3px 11px;font-size:13px}.pills button.on{background:var(--soft);font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
[hidden]{display:none!important}
td.d{white-space:nowrap}
.alert{border-color:var(--loss);background:var(--soft)}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'▸ '}details[open]>summary::before{content:'▾ '}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0 2px}
.seg button{border:0;border-radius:0;background:var(--bg);min-height:44px;font-weight:600;color:var(--mute)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg.res{margin-top:10px}.seg.res button[data-v=W].on{background:var(--win);color:#fff}.seg.res button[data-v=L].on{background:var(--loss);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
dialog #saveMore{min-height:40px}
.dact{margin:16px 0 0;justify-content:flex-end}
@media(max-width:560px){.dact{flex-direction:column-reverse;align-items:stretch}.dact button{width:100%;min-height:46px}}
@media(max-width:400px){.brand{font-size:15px}.pills button{padding:3px 9px}.pills{gap:3px}}
.mrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .chip{margin-top:2px;flex:none}
.mmain{flex:1;min-width:0}.mopp{font-weight:600;overflow-wrap:anywhere}
.mscore{flex:none;text-align:right;max-width:34%;font-variant-numeric:tabular-nums;font-size:14px}
.macts{flex:none;display:flex;gap:6px}
@media(max-width:560px){.macts{flex-direction:column}}
.cbtn{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--soft);color:var(--ink)}.btn:hover{text-decoration:none}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.chip{display:inline-block;min-width:22px;text-align:center;border-radius:6px;font-size:12px;font-weight:700;padding:1px 5px;color:#fff}
.chip.W{background:var(--win)}.chip.L{background:var(--loss)}
.mute{color:var(--mute)}.small{font-size:13px}
.tag{font-size:11px;background:var(--soft);border-radius:6px;padding:1px 6px;color:var(--mute);white-space:nowrap}
.bar-h{height:8px;background:var(--loss);border-radius:4px;overflow:hidden;min-width:60px}.bar-h i{display:block;height:100%;background:var(--win)}
svg text{fill:var(--mute);font-size:11px}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(520px,94vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.4)}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
@media(max-width:560px){.two{grid-template-columns:1fr}.hide-s{display:none}}
/* phones: slim header, bottom tab bar, floating add button, bigger tap targets, no iOS focus-zoom */
@media(max-width:720px){
  .bar{flex-wrap:nowrap;justify-content:space-between;padding:8px 14px;gap:8px}
  .brand{font-size:16px;margin:0;white-space:nowrap}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:6;flex:none;overflow:visible;justify-content:space-around;gap:0;
      background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  nav a{flex:1;flex-direction:column;justify-content:center;gap:2px;min-height:50px;padding:5px 2px;font-size:11px;border-radius:10px}
  nav a.on{background:none;color:var(--accent);font-weight:700}
  nav svg{display:block}
  button[data-act=add]{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;border-radius:99px;padding:12px 20px;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  main{padding:14px 14px calc(150px + env(safe-area-inset-bottom))}
  input,select,textarea{font-size:16px;padding:9px 10px}
  button{min-height:40px}button.sm{min-height:36px;padding:4px 11px}
  .pills button{min-height:34px;padding:3px 12px}
  .row>input,.row>select{flex:1 1 140px}
  dialog{max-height:92dvh;overflow:auto;padding:16px}
  h1{font-size:21px}
}
</style>
</head>
<body>
<header><div class="bar">
  <span class="brand">🎾 Racket Rankings</span>
  <nav id="nav"></nav>
  <div class="pills" id="sportPills"></div>
  <button class="pri" data-act="add">+ Match</button>
</div></header>
<main id="app"></main>

<dialog id="dlg"><form id="mf">
  <h2 id="dlgTitle">Add match</h2>
  <select id="f_type" hidden><option value="singles">Singles</option><option value="doubles">Doubles</option></select>
  <select id="f_res" hidden><option value="W">Win</option><option value="L">Loss</option></select>
  <div class="seg" data-for="f_type"><button type="button" data-v="singles">Singles</button><button type="button" data-v="doubles">Doubles</button></div>
  <div id="partnerBox"><label>Your partner</label><input id="f_partner" list="dl_names" autocomplete="off"></div>
  <div class="two">
    <div><label id="oppLabel">Opponent</label><input id="f_opp1" list="dl_names" autocomplete="off" required></div>
    <div id="opp2Box"><label>Opponent 2</label><input id="f_opp2" list="dl_names" autocomplete="off"></div>
  </div>
  <label>Score, your games first (e.g. 6-4 3-6 10-8)</label>
  <input id="f_score" placeholder="6-4 3-6 10-8" autocomplete="off">
  <div class="seg res" data-for="f_res"><button type="button" data-v="W">Win</button><button type="button" data-v="L">Loss</button></div>
  <div class="two">
    <div><label>Date</label><input type="date" id="f_date" required></div>
    <div><label>Ranking / competition</label><select id="f_rank"></select></div>
  </div>
  <div id="newRk" class="two" hidden>
    <div><label>New ranking name</label><input id="f_rkname" placeholder="e.g. Apostol Santiago ladder"></div>
    <div><label>Sport</label><select id="f_rksport"><option value="tennis">Tennis</option><option value="padel">Padel</option></select></div>
  </div>
  <label>Round / venue / notes</label><input id="f_notes" autocomplete="off">
  <datalist id="dl_names"></datalist>
  <div class="row dact">
    <button type="button" id="cancel">Cancel</button><button type="submit" id="saveMore">Save + add another</button><button class="pri" type="submit" id="saveBtn">Save</button>
  </div>
</form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const KEY='courtlog.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pct=x=>Math.round(x*100)+'%';

/* ---------- storage ---------- */
let db=load();
let ui={sport:'all',mSearch:'',mRank:'',mRes:'',oSearch:'',oSort:'played'};
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.matches&&r.rankings)return r}catch(e){}return{rankings:[],matches:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save to browser storage.')}}

/* ---------- synced data (data.json, written by scripts/scrape.mjs) ---------- */
const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(KEY+k));return v??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){alert('Could not save to browser storage.')}};
const DEFAULT_TPL='Hola {name}, soy {me}. Nos toca jugar nuestro partido del ranking ({label}), antes del {deadline}. ¿Qué días y horas te vienen bien? ¡Gracias!';
let plans=lsGet('.plans',{}),notes=lsGet('.notes',{}),msgTpl=lsGet('.msgtpl',DEFAULT_TPL);
let sync={upcoming:[],standings:[],groups:[],scouting:{},generated:'',status:'not loaded'};
let contacts=(()=>{try{return JSON.parse(localStorage.getItem(KEY+'.contacts'))||[]}catch(e){return[]}})();
const saveContacts=()=>{try{localStorage.setItem(KEY+'.contacts',JSON.stringify(contacts))}catch(e){alert('Could not save contacts.')}};
async function loadSync(){
  try{
    const r=await fetch('data.json?'+Date.now());if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    d.rankings.forEach(rk=>{const x=db.rankings.find(y=>y.id===rk.id);if(x){x.note=rk.note;x.sport=rk.sport;x.synced=true}else db.rankings.push({...rk,synced:true})});
    db.matches=db.matches.filter(m=>!m.ext).concat(d.matches.map(m=>({ts:Date.parse(m.date)||0,...m,id:m.ext})));
    sync={upcoming:d.upcoming||[],standings:d.standings||[],groups:d.groups||[],scouting:d.scouting||{},generated:d.generated,status:'ok',player:d.player};
    save();
  }catch(e){sync.status='no data.json ('+e.message+')'}
  render();
}

/* ---------- stats ---------- */
function parseScore(s){
  const o={sw:0,sl:0,gw:0,gl:0};
  String(s||'').replace(/\(\d+\)/g,'').split(/[\s,;]+/).forEach(t=>{
    const m=t.match(/^(\[?)(\d+)-(\d+)\]?$/);if(!m)return;
    const a=+m[2],b=+m[3];
    if(a>b)o.sw++;else if(b>a)o.sl++;
    if(!m[1]&&Math.max(a,b)<10){o.gw+=a;o.gl+=b}   // [1-0] or 10+ = match tiebreak, not counted as games
  });
  return o;
}
function stats(ms){
  const s={p:ms.length,w:0,l:0,sw:0,sl:0,gw:0,gl:0};
  ms.forEach(m=>{m.result==='W'?s.w++:s.l++;const x=parseScore(m.score);s.sw+=x.sw;s.sl+=x.sl;s.gw+=x.gw;s.gl+=x.gl});
  s.pct=s.p?s.w/s.p:0;return s;
}
const asc=ms=>[...ms].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)||String(a.id).localeCompare(String(b.id)));
const desc=ms=>asc(ms).reverse();
const rankOf=m=>db.rankings.find(r=>r.id===m.rankingId)||{name:'(deleted)',sport:'tennis'};
const visible=()=>db.matches.filter(m=>ui.sport==='all'||rankOf(m).sport===ui.sport);
function streak(ms){const a=desc(ms);if(!a.length)return '–';let n=0;for(const m of a){if(m.result===a[0].result)n++;else break}return a[0].result+n}
const chips=(ms,n=10)=>desc(ms).slice(0,n).reverse().map(m=>`<span class="chip ${m.result}">${m.result}</span>`).join(' ');
const plain=n=>String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const oppKey=plain;
function groupOpponents(ms){
  const map=new Map();
  ms.forEach(m=>(m.opponents||[]).filter(Boolean).forEach(n=>{
    const k=oppKey(n);if(!map.has(k))map.set(k,{name:n.trim(),ms:[]});map.get(k).ms.push(m);
  }));
  return [...map.values()].map(o=>({...o,st:stats(o.ms),last:desc(o.ms)[0]}));
}
function groupPartners(ms){
  const map=new Map();
  ms.filter(m=>m.type==='doubles'&&m.partner).forEach(m=>{
    const k=oppKey(m.partner);if(!map.has(k))map.set(k,{name:m.partner.trim(),ms:[]});map.get(k).ms.push(m);
  });
  return [...map.values()].map(o=>({...o,st:stats(o.ms)}));
}
const matchLabel=m=>(m.type==='doubles'?`${esc(m.partner||'?')} & me vs `:'')+(m.opponents||[]).filter(Boolean).map(n=>`<a href="#/opponents/${encodeURIComponent(n.trim())}">${esc(n)}</a>`).join(' & ');

/* ---------- charts (inline SVG) ---------- */
function rollingChart(ms){
  const a=asc(ms);if(a.length<3)return '<div class="mute small">Need at least 3 matches for a trend.</div>';
  const W=640,H=190,L=34,R=8,T=8,B=22,pw=W-L-R,ph=H-T-B;
  const X=i=>L+(a.length===1?0:i/(a.length-1)*pw),Y=v=>T+(1-v)*ph;
  let w=0;const cum=a.map((m,i)=>{if(m.result==='W')w++;return [X(i),Y(w/(i+1))]});
  const roll=a.map((m,i)=>{const sl=a.slice(Math.max(0,i-9),i+1);return [X(i),Y(sl.filter(x=>x.result==='W').length/sl.length)]});
  const path=p=>p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  const grid=[0,.5,1].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(v)+4}" text-anchor="end">${v*100}%</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Win rate trend">${grid}
    <path d="${path(cum)}" fill="none" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="${path(roll)}" fill="none" stroke="var(--win)" stroke-width="2.5"/>
    <text x="${L}" y="${H-5}">${esc(a[0].date)}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${esc(a[a.length-1].date)}</text></svg>
    <div class="legend"><span><i style="background:var(--win)"></i>Last 10 matches</span><span><i style="background:var(--mute)"></i>Overall to date</span></div>`;
}
function monthlyChart(ms){
  if(!ms.length)return '';
  const by={};ms.forEach(m=>{const k=m.date.slice(0,7);(by[k]=by[k]||{w:0,l:0})[m.result==='W'?'w':'l']++});
  const keys=Object.keys(by).sort();
  const all=[];let [y,mo]=keys[0].split('-').map(Number);const [ey,em]=keys[keys.length-1].split('-').map(Number);
  while(y<ey||(y===ey&&mo<=em)){all.push(y+'-'+String(mo).padStart(2,'0'));if(++mo>12){mo=1;y++}}
  const W=640,H=190,L=26,R=8,T=8,B=24,pw=W-L-R,ph=H-T-B;
  const max=Math.max(...all.map(k=>(by[k]?by[k].w+by[k].l:0)),1);
  const bw=Math.min(36,pw/all.length*.7),step=pw/all.length;
  const bars=all.map((k,i)=>{
    const d=by[k]||{w:0,l:0},x=L+step*i+(step-bw)/2,hw=d.w/max*ph,hl=d.l/max*ph;
    const lab=all.length<=14||i%Math.ceil(all.length/12)===0?`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle">${k.slice(2).replace('-','/')}</text>`:'';
    return `<rect x="${x}" y="${T+ph-hw}" width="${bw}" height="${hw}" fill="var(--win)"><title>${k}: ${d.w}W ${d.l}L</title></rect>
      <rect x="${x}" y="${T+ph-hw-hl}" width="${bw}" height="${hl}" fill="var(--loss)"><title>${k}: ${d.w}W ${d.l}L</title></rect>${lab}`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Matches per month">
    <line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="var(--line)"/>
    <text x="${L-5}" y="${T+8}" text-anchor="end">${max}</text>${bars}</svg>
    <div class="legend"><span><i style="background:var(--win)"></i>Wins</span><span><i style="background:var(--loss)"></i>Losses</span></div>`;
}

/* ---------- view helpers ---------- */
function tiles(s,ms){
  return `<div class="tiles">
  <div class="tile"><b>${s.p}</b><span>matches</span></div>
  <div class="tile"><b>${s.w}–${s.l}</b><span>record</span></div>
  <div class="tile"><b>${pct(s.pct)}</b><span>win rate</span></div>
  <div class="tile"><b>${s.sw}–${s.sl}</b><span>sets</span></div>
  <div class="tile"><b>${s.gw}–${s.gl}</b><span>games</span></div>
  <div class="tile"><b>${streak(ms)}</b><span>current streak</span></div></div>`;
}
const winBar=s=>`<div class="bar-h" title="${s.w}W ${s.l}L"><i style="width:${s.pct*100}%"></i></div>`;
const rec=s=>`${s.w}–${s.l}`;
function matchTable(ms,{edit=true,showRank=true}={}){
  if(!ms.length)return '<div class="empty">No matches yet.</div>';
  return '<div class="mlist">'+desc(ms).map(m=>{
    const sub=[esc(m.date),showRank?`<a href="#/rankings/${m.rankingId}">${esc(rankOf(m).name)}</a>`:'',m.notes?esc(m.notes):''].filter(Boolean).join(' · ');
    return `<div class="mrow"><span class="chip ${m.result}">${m.result}</span>
      <div class="mmain"><div class="mopp">${matchLabel(m)}</div><div class="mute small">${sub}</div></div>
      <div class="mscore">${esc(m.score||'')}</div>
      ${edit&&!m.ext?`<div class="macts"><button class="sm" data-act="edit" data-id="${m.id}" aria-label="Edit match">Edit</button><button class="sm danger" data-act="del" data-id="${m.id}" aria-label="Delete match">✕</button></div>`:''}</div>`}).join('')+'</div>';
}

/* ---------- contacts + next match ---------- */
function findContact(name){
  const t=plain(name).split(' ').filter(w=>w.length>1&&!['de','del','la','las','los','y','da','van','von'].includes(w));
  if(!t.length)return null;
  let best=null,bs=0;
  contacts.forEach(c=>{const ct=new Set(plain(c.name).split(' '));const hit=t.filter(w=>ct.has(w)).length;
    const s=hit/t.length;if(hit>=2&&s>bs||hit>=1&&t.length===1&&s>bs){bs=s;best=c}});
  return bs>=.6?best:null;
}
function waLink(phone){let d=String(phone).replace(/[^\d+]/g,'');if(d.startsWith('00'))d='+'+d.slice(2);if(!d.startsWith('+'))d='+34'+d;return 'https://wa.me/'+d.replace('+','')}
const STATUS=[['','Not contacted yet'],['contacted','Contacted, waiting for a reply'],['agreed','Date agreed'],['played','Played, result still to report']];
const planKey=u=>`${u.rankingId}|${u.label}|${plain(u.opponent)}`;
const fmtDate=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';
const daysLeft=d=>d?Math.ceil((new Date(d)-new Date(today()))/864e5):null;
function msgText(u){
  const first=u.opponent.split(' ')[0],me=(sync.player||'').split(' ')[0]||'';
  return msgTpl.replace(/\{name\}/g,first).replace(/\{me\}/g,me).replace(/\{label\}/g,u.label).replace(/\{deadline\}/g,u.deadline?fmtDate(u.deadline):'la fecha límite');
}
function visibleUpcoming(){return sync.upcoming.filter(u=>ui.sport==='all'||(db.rankings.find(r=>r.id===u.rankingId)||{}).sport===ui.sport)}
function reminders(){
  return visibleUpcoming().filter(u=>{const d=daysLeft(u.deadline);return d!==null&&d<=3&&(plans[planKey(u)]||{}).status!=='played'}).map(u=>{
    const d=daysLeft(u.deadline),p=plans[planKey(u)]||{},st=(STATUS.find(x=>x[0]===(p.status||''))||[])[1];
    return `<div class="card alert">⏰ <b>${esc(u.opponent)}</b>: ${d<0?`play-by date passed ${-d} day${d===-1?'':'s'} ago`:d===0?'play-by date is <b>today</b>':`<b>${d} day${d===1?'':'s'}</b> left to play`} (${fmtDate(u.deadline)}).
      <span class="mute small">${esc(st)}${p.status==='agreed'&&p.when?' · '+esc(p.when.replace('T',' ')):''}</span></div>`}).join('');
}
function planControls(u,i){
  const p=plans[planKey(u)]||{};
  return `<div data-u="${i}" style="margin-top:10px">
    <div class="two"><div><label>Status</label><select data-plan="status">${STATUS.map(([v,t])=>`<option value="${v}" ${(p.status||'')===v?'selected':''}>${t}</option>`).join('')}</select></div>
    ${p.status==='agreed'?`<div><label>Date and time</label><input type="datetime-local" data-plan="when" value="${esc(p.when||'')}"></div>`:''}</div>
    <label>Note</label><input data-plan="note" value="${esc(p.note||'')}" placeholder="e.g. court 3, bring balls" autocomplete="off">
    <div class="cbtn" style="margin-top:8px">${p.status==='agreed'&&p.when?`<button class="btn" data-act="cal-match" data-u="${i}">📅 Add match to calendar</button>`:''}${u.deadline?`<button class="btn" data-act="cal-deadline" data-u="${i}">⏰ Add deadline to calendar</button>`:''}</div></div>`;
}
function nextUp(){
  const ups=visibleUpcoming();
  if(!ups.length)return '';
  return `<div class="card"><h2>Next up</h2>`+ups.sort((a,b)=>(a.deadline||'9').localeCompare(b.deadline||'9')).map(u=>{
    const i=sync.upcoming.indexOf(u),k=oppKey(u.opponent),past=db.matches.filter(m=>(m.opponents||[]).some(n=>oppKey(n)===k)),s=stats(past);
    const days=daysLeft(u.deadline),note=notes[k];
    return `<div style="padding:8px 0;border-top:1px solid var(--line)">
      <div style="font-size:17px;font-weight:600"><a href="#/opponents/${encodeURIComponent(u.opponent)}">${esc(u.opponent)}</a></div>
      <div class="mute small">${esc(u.label)}${u.deadline?` · play by <b>${esc(fmtDate(u.deadline))}</b>${days!==null?` (${days>=0?days+' days left':'overdue'})`:''}`:''}</div>
      ${u.myPos||u.oppPos?`<div class="small" style="margin-top:4px">Ladder position: you <b>#${u.myPos||'?'}</b> · ${esc(u.opponent.split(' ')[0])} <b>#${u.oppPos||'?'}</b></div>`:''}
      <div class="small" style="margin-top:4px">${s.p?`Head-to-head <b>${rec(s)}</b>, last ${esc(desc(past)[0].date)}`:'First meeting'}</div>
      ${note?`<div class="small" style="margin-top:4px">📝 ${esc(note)}</div>`:''}
      <div style="margin-top:8px">${contactBlock(u.opponent,i)}</div>
      ${planControls(u,i)}
      <details data-open="${i}" ${ui.open&&ui.open[i]?'open':''} style="margin-top:10px"><summary class="small" style="cursor:pointer;color:var(--accent);min-height:32px">Scouting report</summary>${scoutBlock(u.opponent,u)}</details></div>`}).join('')+'</div>';
}
function contactBlock(name,i){
  const c=findContact(name);
  if(!c)return `<span class="mute small">No contact on file.${contacts.length?'':' <a href="#/data">Import your contact sheet</a>'}</span>`;
  const u=i!==undefined?sync.upcoming[i]:null;
  return `${c.phone?`<div class="cbtn"><a class="btn" href="tel:${esc(c.phone.replace(/[^\d+]/g,''))}">📞 ${esc(c.phone)}</a>
    ${u?`<a class="btn" href="${waLink(c.phone)}?text=${encodeURIComponent(msgText(u))}" target="_blank" rel="noopener">💬 Propose a time</a><button class="btn" data-act="copymsg" data-u="${i}">Copy message</button>`
       :`<a class="btn" href="${waLink(c.phone)}" target="_blank" rel="noopener">💬 WhatsApp</a>`}</div>`:''}${c.email?`<div class="small"><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>`:''}`;
}
function scoutBlock(name,u){
  const sc=sync.scouting[plain(name)];
  if(!sc||!sc.matches.length)return '<p class="mute small">No recent results found for this player yet.</p>';
  const ms=sc.matches,w=ms.filter(m=>m.result==='W').length;
  let three=0,straight=0,gw=0,gl=0;
  ms.forEach(m=>{const x=parseScore(m.score);gw+=x.gw;gl+=x.gl;if(x.sw+x.sl>=3)three++;if(m.result==='W'&&x.sl===0&&x.sw>0)straight++});
  const first=ms[ms.length-1].theirPos,now=sc.pos||ms[0].theirPos;
  const trend=first&&now?(now<first?`climbing: #${first} → #${now}`:now>first?`slipping: #${first} → #${now}`:`holding at #${now}`):'';
  return `<div class="small">
    <div style="margin:6px 0"><b>${esc(name.split(' ')[0])}</b>${sc.pos?` is #${sc.pos}`:''}${trend?`, ${trend} over the last ${ms.length} matches`:''}.</div>
    <div>Won <b>${w} of ${ms.length}</b> · straight-set wins ${straight} · went to a 3rd set/tiebreak ${three}×${gw+gl?` · games ${gw}–${gl}`:''}</div>
    <div style="margin:6px 0">${ms.slice().reverse().map(m=>`<span class="chip ${m.result}">${m.result}</span>`).join(' ')}</div>
    <div class="tw"><table><tbody>${ms.slice(0,6).map(m=>`<tr><td class="d">${esc(m.date.slice(5))}</td><td>${esc(m.vs)}${m.vsPos?` <span class="mute">#${m.vsPos}</span>`:''}</td><td class="n">${esc(m.score)}</td><td><span class="chip ${m.result}">${m.result}</span></td></tr>`).join('')}</tbody></table></div>
    <div class="mute" style="margin-top:4px">From the public cuadros; matches against you are in your head-to-head.</div></div>`;
}
function ics(filename,ev){
  const pad=n=>String(n).padStart(2,'0'),t=x=>String(x).replace(/[\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const stamp=new Date().toISOString().replace(/[-:]|\.\d+/g,'');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Racket Rankings//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT',`UID:${uid()}${uid()}@racket-rankings`,`DTSTAMP:${stamp}`,...ev(pad,t),'END:VEVENT','END:VCALENDAR'];
  download(filename,lines.join('\r\n')+'\r\n','text/calendar');
}
function calMatch(u){
  const p=plans[planKey(u)]||{};if(!p.when)return;
  const st=new Date(p.when),en=new Date(st.getTime()+90*60000);
  const f=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}00`;
  ics('match-'+plain(u.opponent).replace(/ /g,'-')+'.ics',(pad,t)=>[`DTSTART:${f(st)}`,`DTEND:${f(en)}`,`SUMMARY:${t('Tennis vs '+u.opponent)}`,`DESCRIPTION:${t(u.label+(p.note?'\n'+p.note:''))}`,
    'BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY',`DESCRIPTION:${t('Match vs '+u.opponent)}`,'END:VALARM']);
}
function calDeadline(u){
  const d=new Date(u.deadline+'T00:00:00'),n=new Date(d.getTime()+864e5);
  const f=x=>`${x.getFullYear()}${String(x.getMonth()+1).padStart(2,'0')}${String(x.getDate()).padStart(2,'0')}`;
  ics('deadline-'+plain(u.opponent).replace(/ /g,'-')+'.ics',(pad,t)=>[`DTSTART;VALUE=DATE:${f(d)}`,`DTEND;VALUE=DATE:${f(n)}`,`SUMMARY:${t('Deadline: play '+u.opponent)}`,`DESCRIPTION:${t(u.label)}`,
    'BEGIN:VALARM','TRIGGER:-P3D','ACTION:DISPLAY','DESCRIPTION:Play-by date in 3 days','END:VALARM','BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Play-by date tomorrow','END:VALARM']);
}
const ord=n=>n+([,'st','nd','rd'][n%100>>3^1&&n%10]||'th');
const fmtD=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
function standingBlock(rankingId){
  const st=sync.standings.find(x=>x.rankingId===rankingId),g=sync.groups.find(x=>x.rankingId===rankingId);
  let h='';
  if(st)h+=`<div style="font-size:22px;font-weight:700">#${st.pos}<span class="mute small" style="font-weight:400"> of ${st.of} on the ladder · ${esc(st.label)}</span></div>`;
  if(g){
    const me=g.players.find(p=>p.me);
    h+=`<div style="font-size:18px;font-weight:700">${esc(g.name)}${me&&me.pos?` · ${ord(me.pos)} of ${g.players.length}`:''}<span class="mute small" style="font-weight:400"> · Fase ${g.phase}, ${g.current?'in progress':'finished'} (${fmtD(g.start)}–${fmtD(g.end)})</span></div>`;
    if(g.overall)h+=`<div class="small mute">Overall across all groups: #${g.overall.pos} of ${g.overall.of}</div>`;
    if(!g.current)h+=`<div class="small mute" style="margin-top:4px">You are not in the current phase. Your new group appears here after the next sync once you are signed up.</div>`;
  }
  return h;
}
function groupTable(g){
  return `<div class="tw"><table><thead><tr><th class="n">#</th><th>Player</th><th class="n">P</th><th class="n">W–L</th><th class="n hide-s">Sets</th><th class="n hide-s">Games</th><th class="n">Pts</th></tr></thead><tbody>`+
    g.players.map(p=>`<tr${p.me?' style="background:var(--soft);font-weight:700"':''}><td class="n">${p.pos||'–'}</td><td><a href="#/opponents/${encodeURIComponent(p.name)}">${esc(p.name)}</a>${p.me?' <span class="tag">you</span>':''}</td>
    <td class="n">${p.pj}</td><td class="n">${p.pg}–${p.pp}</td><td class="n hide-s">${p.sg}–${p.sp}</td><td class="n hide-s">${p.jg}–${p.jp}</td><td class="n">${p.pts}</td></tr>`).join('')+'</tbody></table></div>';
}
function standingsCard(){
  const items=db.rankings.filter(r=>ui.sport==='all'||r.sport===ui.sport).map(r=>({r,b:standingBlock(r.id)})).filter(x=>x.b);
  if(!items.length)return '';
  return `<div class="card"><h2>Where you stand</h2>`+items.map(({r,b})=>`<div style="padding:6px 0"><div class="small" style="margin-bottom:2px"><a href="#/rankings/${r.id}"><b>${esc(r.name)}</b></a></div>${b}</div>`).join('')+'</div>';
}
function posChart(ms){
  const a=asc(ms.filter(m=>m.pos));if(a.length<2)return '';
  const W=640,H=190,L=34,R=8,T=10,B=22,pw=W-L-R,ph=H-T-B;
  const lo=Math.min(...a.map(m=>m.pos)),hi=Math.max(...a.map(m=>m.pos)),span=Math.max(hi-lo,1);
  const X=i=>L+i/(a.length-1)*pw,Y=p=>T+(p-lo)/span*ph;   // best (lowest) position at the top
  const pts=a.map((m,i)=>[X(i),Y(m.pos)]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ladder position over time">
    <text x="${L-5}" y="${T+4}" text-anchor="end">${lo}</text><text x="${L-5}" y="${T+ph+4}" text-anchor="end">${hi}</text>
    <line x1="${L}" x2="${W-R}" y1="${T}" y2="${T}" stroke="var(--line)"/><line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="var(--line)"/>
    <path d="${pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('')}" fill="none" stroke="var(--win)" stroke-width="2.5"/>
    ${a.map((m,i)=>`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="4" fill="${m.result==='W'?'var(--win)':'var(--loss)'}"><title>${esc(m.date)}: position ${m.pos} (${m.result})</title></circle>`).join('')}
    <text x="${L}" y="${H-5}">${esc(a[0].date)}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${esc(a[a.length-1].date)}</text></svg>
    <div class="legend"><span>Ladder position (top = better)</span><span><i style="background:var(--win)"></i>won that match</span><span><i style="background:var(--loss)"></i>lost</span></div>`;
}
function oppTable(list,{limit}={}){
  if(!list.length)return '<div class="empty">Nothing here yet.</div>';
  const rows=(limit?list.slice(0,limit):list).map(o=>`<tr><td><a href="#/opponents/${encodeURIComponent(o.name)}">${esc(o.name)}</a></td>
    <td class="n">${o.st.p}</td><td class="n">${rec(o.st)}</td><td style="width:90px">${winBar(o.st)}</td><td class="small hide-s">${o.last?esc(o.last.date):''}</td></tr>`).join('');
  return `<div class="tw"><table><thead><tr><th>Name</th><th class="n">P</th><th class="n">W–L</th><th></th><th class="hide-s">Last</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
const noData=`<div class="card empty"><p><b>No matches yet.</b></p><p>Add your first match, import a CSV, or load sample data to explore.</p>
<button class="pri" data-act="add">+ Add match</button> <button data-act="sample">Load sample data</button></div>`;

/* ---------- pages ---------- */
function pageDashboard(){
  const ms=visible();if(!ms.length)return '<h1>Overview</h1>'+noData;
  const s=stats(ms);
  const opps=groupOpponents(ms);
  const rivals=[...opps].sort((a,b)=>b.st.p-a.st.p||a.name.localeCompare(b.name));
  const nemesis=opps.filter(o=>o.st.l>o.st.w).sort((a,b)=>(b.st.l-b.st.w)-(a.st.l-a.st.w));
  const faves=opps.filter(o=>o.st.w>o.st.l).sort((a,b)=>(b.st.w-b.st.l)-(a.st.w-a.st.l));
  const rks=db.rankings.filter(r=>ui.sport==='all'||r.sport===ui.sport).map(r=>({r,ms:ms.filter(m=>m.rankingId===r.id)})).filter(x=>x.ms.length);
  return `<h1>Overview</h1>${reminders()}${nextUp()}${standingsCard()}${tiles(s,ms)}
  <div class="card"><h2>Recent form</h2>${chips(ms,15)}</div>
  <div class="grid g2"><div class="card"><h2>Win rate trend</h2>${rollingChart(ms)}</div><div class="card"><h2>Matches per month</h2>${monthlyChart(ms)}</div></div>
  <div class="card"><h2>By ranking</h2><div class="tw"><table><thead><tr><th>Ranking</th><th class="n">P</th><th class="n">W–L</th><th class="n">Win %</th><th>Form</th></tr></thead><tbody>
  ${rks.map(({r,ms})=>{const t=stats(ms);return `<tr><td><a href="#/rankings/${r.id}">${esc(r.name)}</a> <span class="tag">${r.sport}</span></td><td class="n">${t.p}</td><td class="n">${rec(t)}</td><td class="n">${pct(t.pct)}</td><td>${chips(ms,5)}</td></tr>`}).join('')}</tbody></table></div></div>
  <div class="grid g2"><div class="card"><h2>Most played</h2>${oppTable(rivals,{limit:6})}</div>
  <div class="card"><h2>Toughest opponents</h2>${oppTable(nemesis,{limit:6})}<h2 style="margin-top:14px">Best records against</h2>${oppTable(faves,{limit:6})}</div></div>
  <div class="card"><h2>Latest matches</h2>${matchTable(desc(ms).slice(0,6),{edit:false})}</div>`;
}
function pageMatches(){
  const opts=db.rankings.map(r=>`<option value="${r.id}" ${ui.mRank===r.id?'selected':''}>${esc(r.name)}</option>`).join('');
  return `<h1>Matches</h1><div class="row"><input id="mq" placeholder="Search…" value="${esc(ui.mSearch)}">
  <select id="mr"><option value="">All rankings</option>${opts}</select>
  <select id="mres"><option value="">W + L</option><option value="W" ${ui.mRes==='W'?'selected':''}>Wins</option><option value="L" ${ui.mRes==='L'?'selected':''}>Losses</option></select></div>
  <div class="card" id="mlist"></div>`;
}
function fillMatches(){
  const q=ui.mSearch.toLowerCase();
  const ms=visible().filter(m=>(!ui.mRank||m.rankingId===ui.mRank)&&(!ui.mRes||m.result===ui.mRes)&&
    (!q||[...(m.opponents||[]),m.partner,m.notes,m.score].join(' ').toLowerCase().includes(q)));
  $('#mlist').innerHTML=`<div class="mute small" style="margin-bottom:6px">${ms.length} match${ms.length===1?'':'es'} · ${rec(stats(ms))}</div>`+matchTable(ms);

function pageOpponents(){
  if(!visible().length)return '<h1>Opponents</h1>'+noData;
  return `<h1>Opponents</h1><div class="row"><input id="oq" placeholder="Search name…" value="${esc(ui.oSearch)}">
  <select id="os">${[['played','Most played'],['win','Best win %'],['loss','Worst win %'],['recent','Most recent'],['name','Name']].map(([v,t])=>`<option value="${v}" ${ui.oSort===v?'selected':''}>${t}</option>`).join('')}</select></div>
  <div class="card" id="olist"></div>`;

function fillOpponents(){
  let l=groupOpponents(visible()).filter(o=>o.name.toLowerCase().includes(ui.oSearch.toLowerCase()));
  const sorts={played:(a,b)=>b.st.p-a.st.p,win:(a,b)=>b.st.pct-a.st.pct||b.st.p-a.st.p,loss:(a,b)=>a.st.pct-b.st.pct||b.st.p-a.st.p,
    recent:(a,b)=>b.last.date.localeCompare(a.last.date),name:(a,b)=>a.name.localeCompare(b.name)};
  l.sort(sorts[ui.oSort]);$('#olist').innerHTML=oppTable(l);

function pageOpponent(name){

    const up=sync.upcoming.find(u=>oppKey(u.opponent)===k);

  }
  const s=stats(ms),sing=stats(ms.filter(m=>m.type==='singles')),dbl=stats(ms.filter(m=>m.type==='doubles'));
  const per=db.rankings.map(r=>({r,s:stats(ms.filter(m=>m.rankingId===r.id))})).filter(x=>x.s.p);
  const ds=asc(ms);
  return `<p class="small"><a href="#/opponents">← Opponents</a></p><h1>${esc(ms[0].opponents.find(n=>n&&oppKey(n)===k))}</h1>${tiles(s,ms)}
  <div class="card"><h2>Private notes</h2><textarea id="oppNote" data-opp="${esc(k)}" rows="3" placeholder="e.g. plays on clay only, strong backhand, prefers evenings">${esc(notes[k]||'')}</textarea><div class="mute small" style="margin-top:4px">Saved on this device only.</div></div>
  ${sync.scouting[k]?`<div class="card"><h2>Scouting report</h2>${scoutBlock(ms[0].opponents.find(n=>n&&oppKey(n)===k))}</div>`:''}
  ${contacts.length?`<div class="card"><h2>Contact</h2>${contactBlock(ms[0].opponents.find(n=>n&&oppKey(n)===k))}</div>`:''}
  <div class="grid g2"><div class="card"><h2>Head-to-head</h2>
   <p style="margin:0 0 8px">First met <b>${ds[0].date}</b>, last met <b>${ds[ds.length-1].date}</b></p>
   <p style="margin:0 0 8px">Singles ${rec(sing)} · Doubles ${rec(dbl)}</p><div>${chips(ms,15)}</div></div>

/* ---------- csv / json ---------- */
function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows;
}
const csvCell=v=>/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v;
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const CSV_HEAD='date,ranking,sport,type,partner,opponent1,opponent2,score,result,notes';
function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2){alert('No rows found.');return}
  const head=rows[0].map(h=>h.trim().toLowerCase());const col=n=>head.indexOf(n);
  if(col('date')<0||col('opponent1')<0){alert('CSV needs at least "date" and "opponent1" columns.');return}
  let n=0,bad=0;
  rows.slice(1).forEach(r=>{
    const g=k=>col(k)<0?'':(r[col(k)]||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(g('date'))||!g('opponent1')){bad++;return}
    const rname=g('ranking')||'Imported';let rk=db.rankings.find(x=>x.name.toLowerCase()===rname.toLowerCase());
    if(!rk){rk={id:uid(),name:rname,sport:g('sport').toLowerCase()==='padel'?'padel':'tennis'};db.rankings.push(rk)}
    const x=parseScore(g('score'));let res=g('result').toUpperCase().slice(0,1);
    if(res!=='W'&&res!=='L')res=x.sw>=x.sl?'W':'L';
    const type=g('type').toLowerCase()==='doubles'||g('partner')?'doubles':'singles';
    db.matches.push({id:uid(),ts:Date.now()+n,date:g('date'),rankingId:rk.id,type,partner:g('partner'),opponents:[g('opponent1'),g('opponent2')].filter(Boolean),score:g('score'),result:res,notes:g('notes')});
    n++;
  });
  save();render();alert(`Imported ${n} matches.`+(bad?` Skipped ${bad} rows (need date as YYYY-MM-DD and an opponent).`:''));
}

function importContacts(text){
  const first=text.split(/\r?\n/)[0]||'';const delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':first.includes('\t')?'\t':',';
  const rows=(delim===','?parseCSV(text):text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(delim).map(x=>x.replace(/^"|"$/g,''))));
  if(rows.length<2){alert('No rows found.');return}
  const head=rows[0].map(h=>plain(h));
  const find=(...k)=>head.findIndex(h=>k.some(x=>h.includes(x)));
  let iN=find('nombre y apellidos','name','nombre','jugador','player'),iS=find('apellido','surname','last'),iP=find('movil','mobile','telefono','tel','phone'),iE=find('email','correo','mail');
  if(iN<0&&iS<0){alert('Could not find a name column. Headers seen: '+rows[0].join(', '));return}
  const out=[];
  rows.slice(1).forEach(r=>{
    const g=i=>i<0?'':String(r[i]||'').trim();
    let name=iS>=0&&iS!==iN?`${g(iN)} ${g(iS)}`.trim():g(iN);
    if(name.includes(',')){const [a,b]=name.split(',');name=`${b.trim()} ${a.trim()}`}
    const phone=g(iP),email=g(iE);
    if(name&&(phone||email))out.push({name,phone,email});
  });
  mergeContacts(out);
}
function mergeContacts(out){
  const byName=new Map(contacts.map(c=>[plain(c.name),c]));
  out.forEach(c=>byName.set(plain(c.name),{...byName.get(plain(c.name)),...c}));   // merge sources; newer import wins
  contacts=[...byName.values()];saveContacts();render();alert(`Added ${out.length} contacts (${contacts.length} stored in total).`);
}
function importPasted(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length){alert('Paste some contacts first.');return}
  if(/(nombre|name|apellid)/i.test(lines[0])&&/[,;\t]/.test(lines[0])){importContacts(text);return}   // pasted a CSV with a header row
  const out=[];
  lines.forEach(l=>{
    const email=(l.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/)||[''])[0];
    const phone=(l.match(/\+?\d[\d\s().-]{7,}\d/)||[''])[0].replace(/[^\d+]/g,'');
    let name=l.replace(email,' ').replace(/\+?\d[\d\s().-]{7,}\d/,' ').replace(/[;\t|]+/g,' ').replace(/\s+/g,' ').replace(/^[\s,.-]+|[\s,.-]+$/g,'');
    if((name.match(/,/g)||[]).length===1){const [a,b]=name.split(',');name=`${b.trim()} ${a.trim()}`}   // "Surname, Name"
    name=name.replace(/,/g,' ').replace(/\s+/g,' ').trim();
    if(name&&(phone||email))out.push({name,phone,email});
  });
  if(!out.length){alert('Could not find a name plus a phone number or email on any line.');return}
  $('#pasteC').value='';mergeContacts(out);
}

/* ---------- sample data ---------- */
function loadSample(){
  if(db.matches.length&&!confirm('Add sample data to your existing data?'))return;
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const names=['Anna Keller','Ben Fischer','Carlos Ruiz','Dana Weiss','Elias Brandt','Fiona Maier','Gabor Nagy','Hanna Roth','Ivo Novak','Jonas Huber'];
  const r1={id:uid(),name:'Club Ladder',sport:'tennis'},r2={id:uid(),name:'Regional League',sport:'tennis'},r3={id:uid(),name:'Padel Americano Series',sport:'padel'};
  db.rankings.push(r1,r2,r3);
  const strength={};names.forEach(n=>strength[n]=.25+rnd()*.5);
  const start=new Date();start.setMonth(start.getMonth()-14);
  for(let i=0;i<70;i++){
    const d=new Date(start.getTime()+i/70*(Date.now()-start.getTime()));
    const r=[r1,r2,r3][Math.floor(rnd()*3)],dbl=r.sport==='padel'||rnd()<.25;
    const o1=names[Math.floor(rnd()*names.length)];let o2=names[Math.floor(rnd()*names.length)];while(o2===o1)o2=names[Math.floor(rnd()*names.length)];
    const p=names[Math.floor(rnd()*names.length)];
    const win=rnd()>strength[o1]+(i/70)*.1;
    const sets=[];let a=0,b=0;
    while(a<2&&b<2){const w=win?rnd()<.75:rnd()<.25;const l=Math.floor(rnd()*5);if(w){a++;sets.push(l===4?'7-6':'6-'+l)}else{b++;sets.push(l===4?'6-7':l+'-6')}}
    db.matches.push({id:uid(),ts:i,date:d.toISOString().slice(0,10),rankingId:r.id,type:dbl?'doubles':'singles',partner:dbl&&p!==o1&&p!==o2?p:'',
      opponents:dbl?[o1,o2]:[o1],score:sets.join(' '),result:a>b?'W':'L',notes:''});
  }
  save();render();
}

    download('courtlog-matches-'+today()+'.csv',[CSV_HEAD,...lines].join('\n'),'text/csv');
  }
  else if(act==='csvtemplate')download('courtlog-template.csv',CSV_HEAD+'\n2026-05-02,Club Ladder,tennis,singles,,Anna Keller,,6-4 3-6 10-8,W,Round 2\n2026-05-09,Padel Series,padel,doubles,Ben Fischer,Dana Weiss,Ivo Novak,4-6 6-3 6-2,W,\n','text/csv');
  else if(act==='resync')loadSync();
  else if(act==='pastecontacts')importPasted($('#pasteC').value);
  else if(act==='savetpl'){msgTpl=$('#tplBox').value.trim()||DEFAULT_TPL;lsSet('.msgtpl',msgTpl);toast('Message saved ✓')}
  else if(act==='resettpl'){msgTpl=DEFAULT_TPL;lsSet('.msgtpl',msgTpl);render();toast('Message reset')}
  else if(act==='cal-match')calMatch(sync.upcoming[+b.dataset.u]);
  else if(act==='cal-deadline')calDeadline(sync.upcoming[+b.dataset.u]);
  else if(act==='copymsg'){const t=msgText(sync.upcoming[+b.dataset.u]);
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Message copied ✓'),()=>prompt('Copy this message:',t))}
  else if(act==='clearcontacts'){if(confirm('Remove all stored contacts?')){contacts=[];saveContacts();render()}}
  else if(act==='importjson'||act==='importcsv'||act==='importcontacts'){
    const f=$('#file');f.accept=act==='importjson'?'.json':'.csv,text/csv,.txt';f.value='';
    f.onchange=()=>{const file=f.files[0];if(!file)return;const rd=new FileReader();
      rd.onload=()=>{
        if(act==='importcsv'){importCSV(String(rd.result));return}
        if(act==='importcontacts'){importContacts(String(rd.result));return}
        try{const d=JSON.parse(rd.result);if(!d.rankings||!d.matches)throw 0;
          if(confirm(`Replace current data with backup (${d.matches.length} matches)?`)){plans=d.plans||plans;notes=d.notes||notes;lsSet('.plans',plans);lsSet('.notes',notes);db={rankings:d.rankings,matches:d.matches};save();render()}}
        catch(_){alert('That file is not a Racket Rankings backup.')}};
      rd.readAsText(file)};
    f.click();
  }
});
document.addEventListener('input',e=>{
  const t=e.target.id;
  if(t==='mq'){ui.mSearch=e.target.value;fillMatches()}
  else if(t==='oq'){ui.oSearch=e.target.value;fillOpponents()}
});
document.addEventListener('change',e=>{
  const t=e.target.id;
  if(e.target.dataset.plan){const u=sync.upcoming[+e.target.closest('[data-u]').dataset.u],k=planKey(u);
    plans[k]={...plans[k],[e.target.dataset.plan]:e.target.value};lsSet('.plans',plans);render();return}
  if(t==='oppNote'){const k=e.target.dataset.opp;if(e.target.value.trim())notes[k]=e.target.value.trim();else delete notes[k];lsSet('.notes',notes);toast('Note saved ✓');return}
  if(t==='mr'){ui.mRank=e.target.value;fillMatches()}
  else if(t==='mres'){ui.mRes=e.target.value;fillMatches()}
  else if(t==='os'){ui.oSort=e.target.value;fillOpponents()}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.tagName==='DETAILS'&&d.dataset.open!==undefined){ui.open=ui.open||{};ui.open[d.dataset.open]=d.open}},true);
document.addEventListener('submit',e=>{
  if(e.target.id==='rkForm'){e.preventDefault();db.rankings.push({id:uid(),name:$('#rkn').value.trim(),sport:$('#rks').value});save();render()}
});
render();
loadSync();
</script>
</body>
</html>
