<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rankings">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Racket Rankings</title>
<style>
:root{
  --bg:#f5f6f3;--card:#fff;--ink:#1a2220;--mute:#65706b;--line:#e2e5e0;
  --accent:#1f6f5c;--accent-ink:#fff;--win:#2b78d6;--loss:#e07b2c;--soft:#eef1ed;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121615;--card:#1b2120;--ink:#e8ece9;--mute:#98a39e;--line:#2b3331;
    --accent:#4fb89c;--accent-ink:#0c1512;--win:#5aa0f2;--loss:#f0974d;--soft:#242b29;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
html{-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:6px}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}
nav a{padding:6px 11px;border-radius:8px;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:6px}
nav svg{display:none;width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.on{background:var(--soft);color:var(--ink);font-weight:600;text-decoration:none}
main{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.tile span{color:var(--mute);font-size:12px}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.sm{padding:2px 8px;font-size:13px}
button.danger{color:var(--loss)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row>input,.row>select{width:auto;min-width:140px}
.pills{display:flex;gap:4px}
.pills button{border-radius:99px;padding:3px 11px;font-size:13px}.pills button.on{background:var(--soft);font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
[hidden]{display:none!important}
.ninp{margin-top:6px}
td.d{white-space:nowrap}
.fresh{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);margin:-6px 0 10px}.dot{width:8px;height:8px;border-radius:50%;background:var(--up);flex:none}
:root{--up:#2e9a6b;--down:#e07b2c}
.race{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0 2px}
.zonelbl{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:10px 0 2px;display:flex;align-items:center;gap:6px}.zonelbl i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lbrow{display:flex;align-items:center;gap:10px;padding:9px 0 9px 8px;border-top:1px solid var(--line);border-left:4px solid transparent;min-height:54px;cursor:pointer}
.lbrow.up{border-left-color:var(--up)}.lbrow.down{border-left-color:var(--down)}.lbrow.me{background:var(--soft);cursor:default}
.lbrow .pos{width:18px;text-align:center;font-weight:700;color:var(--mute)}.lbrow .who{flex:1;min-width:0}.lbrow .who b{display:block;font-size:15px}
.lbrow .pts{text-align:right;font-variant-numeric:tabular-nums}.lbrow .pts b{font-size:19px;display:block;line-height:1}.lbrow .pts span{font-size:11px;color:var(--mute)}
.lbrow .chev{color:var(--mute);font-size:13px;width:12px}
.lbd>summary::before{content:none}.lbd[open]>summary .chev{transform:rotate(90deg)}
.lbopen{background:var(--bg);border-top:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 12px 12px;margin-bottom:4px}
.lbopen .blk{margin-top:10px}.lbopen .lbl{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.mr{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line);font-size:13px}.lbopen .mr:first-of-type{border-top:0}.mr .t{flex:1}.mr .s{white-space:nowrap}
.uphead{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 0}
.uprow{border-top:1px solid var(--line)}.uphead+.uprow{border-top:0}
.uprow>summary{display:flex;align-items:center;gap:8px;padding:10px 0;cursor:pointer;min-height:56px}
.uprow>summary::before{content:'▸';color:var(--mute);flex:none;font-size:15px;width:14px}.uprow[open]>summary::before{content:'▾'}
.upmain{flex:1;min-width:0}.upname{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.st{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--soft);color:var(--mute)}
.st.none{background:transparent;border:1px solid var(--loss);color:var(--loss)}.st.agreed{background:var(--accent);color:var(--accent-ink)}
.upbody{padding:0 0 12px 18px}
.calrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}.calrow>span{flex:1 1 0;min-width:0;font-size:14px}.calrow .btn{white-space:nowrap;padding:6px 10px;font-size:14px}
.alert{border-color:var(--loss);background:var(--soft)}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'▸ '}details[open]>summary::before{content:'▾ '}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0 2px}
.seg button{border:0;border-radius:0;background:var(--bg);min-height:44px;font-weight:600;color:var(--mute)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg.res{margin-top:10px}.seg.res button[data-v=W].on{background:var(--win);color:#fff}.seg.res button[data-v=L].on{background:var(--loss);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
dialog #saveMore{min-height:40px}
.dact{margin:16px 0 0;justify-content:flex-end}
@media(max-width:560px){.dact{flex-direction:column-reverse;align-items:stretch}.dact button{width:100%;min-height:46px}}
@media(max-width:400px){.brand{font-size:15px}.pills button{padding:3px 9px}.pills{gap:3px}}
.mrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .chip{margin-top:2px;flex:none}
.mmain{flex:1;min-width:0}.mopp{font-weight:600;overflow-wrap:anywhere}
.mscore{flex:none;text-align:right;max-width:34%;font-variant-numeric:tabular-nums;font-size:14px}
.macts{flex:none;display:flex;gap:6px}
@media(max-width:560px){.macts{flex-direction:column}}
.cbtn{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--soft);color:var(--ink)}.btn:hover{text-decoration:none}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.chip{display:inline-block;min-width:22px;text-align:center;border-radius:6px;font-size:12px;font-weight:700;padding:1px 5px;color:#fff}
.chip.W{background:var(--win)}.chip.L{background:var(--loss)}
.mute{color:var(--mute)}.small{font-size:13px}
.tag{font-size:11px;background:var(--soft);border-radius:6px;padding:1px 6px;color:var(--mute);white-space:nowrap}
.bar-h{height:8px;background:var(--loss);border-radius:4px;overflow:hidden;min-width:60px}.bar-h i{display:block;height:100%;background:var(--win)}
svg text{fill:var(--mute);font-size:11px}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(520px,94vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.4)}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
@media(max-width:560px){.two{grid-template-columns:1fr}.hide-s{display:none}}
/* phones: slim header, bottom tab bar, floating add button, bigger tap targets, no iOS focus-zoom */
@media(max-width:720px){
  .bar{flex-wrap:nowrap;justify-content:space-between;padding:8px 14px;gap:8px}
  .brand{font-size:16px;margin:0;white-space:nowrap}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:6;flex:none;overflow:visible;justify-content:space-around;gap:0;
      background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  nav a{flex:1;flex-direction:column;justify-content:center;gap:2px;min-height:50px;padding:5px 2px;font-size:11px;border-radius:10px}
  nav a.on{background:none;color:var(--accent);font-weight:700}
  nav svg{display:block}
  button[data-act=add]{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;border-radius:99px;padding:12px 20px;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  main{padding:14px 14px calc(150px + env(safe-area-inset-bottom))}
  input,select,textarea{font-size:16px;padding:9px 10px}
  button{min-height:40px}button.sm{min-height:36px;padding:4px 11px}
  .pills button{min-height:34px;padding:3px 12px}
  .row>input,.row>select{flex:1 1 140px}
  dialog{max-height:92dvh;overflow:auto;padding:16px}
  h1{font-size:21px}
}
.focuscarry{border-top:1px solid var(--line);padding:12px 0}.focuswords{font-size:16px;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}#focusForm textarea{resize:vertical}#focusForm button{min-height:44px}
</style>
</head>
<body>
<header><div class="bar">
  <span class="brand">🎾 Racket Rankings</span>
  <nav id="nav"></nav>
  <div class="pills" id="sportPills"></div>
  <button class="pri" data-act="add">+ Match</button>
</div></header>
<main id="app"></main>

<dialog id="dlg"><form id="mf">
  <h2 id="dlgTitle">Add match</h2>
  <select id="f_type" hidden><option value="singles">Singles</option><option value="doubles">Doubles</option></select>
  <select id="f_res" hidden><option value="W">Win</option><option value="L">Loss</option></select>
  <div class="seg" data-for="f_type"><button type="button" data-v="singles">Singles</button><button type="button" data-v="doubles">Doubles</button></div>
  <div id="partnerBox"><label>Your partner</label><select class="nsel" data-for="f_partner"></select><input id="f_partner" class="ninp" placeholder="Partner's name" autocomplete="off" hidden></div>
  <div class="two">
    <div><label id="oppLabel">Opponent</label><select class="nsel" data-for="f_opp1"></select><input id="f_opp1" class="ninp" placeholder="New opponent's name" autocomplete="off" hidden></div>
    <div id="opp2Box"><label>Opponent 2</label><select class="nsel" data-for="f_opp2"></select><input id="f_opp2" class="ninp" placeholder="New opponent's name" autocomplete="off" hidden></div>
  </div>
  <label>Score, your games first (e.g. 6-4 3-6 10-8)</label>
  <input id="f_score" placeholder="6-4 3-6 10-8" autocomplete="off">
  <div class="seg res" data-for="f_res"><button type="button" data-v="W">Win</button><button type="button" data-v="L">Loss</button></div>
  <div class="two">
    <div><label>Date</label><input type="date" id="f_date" required></div>
    <div><label>Ranking / competition</label><select id="f_rank"></select></div>
  </div>
  <div id="newRk" class="two" hidden>
    <div><label>New ranking name</label><input id="f_rkname" placeholder="e.g. Apostol Santiago ladder"></div>
    <div><label>Sport</label><select id="f_rksport"><option value="tennis">Tennis</option><option value="padel">Padel</option></select></div>
  </div>
  <label>Round / venue / notes</label><input id="f_notes" autocomplete="off">
  <datalist id="dl_names"></datalist>
  <div class="row dact">
    <button type="button" id="cancel">Cancel</button><button type="submit" id="saveMore">Save + add another</button><button class="pri" type="submit" id="saveBtn">Save</button>
  </div>
</form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const KEY='courtlog.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pct=x=>Math.round(x*100)+'%';

/* ---------- storage ---------- */
let db=load();
let ui={sport:'all',mSearch:'',mRank:'',mRes:'',oSearch:'',oSort:'played'};
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.matches&&r.rankings)return r}catch(e){}return{rankings:[],matches:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save to browser storage.')}}

async function loadEnc(){try{const r=await fetch('contacts.enc.json?'+Date.now());if(r.ok){encBlob=await r.json();render()}}catch(e){}}
async function unlockContacts(pw){
  if(!encBlob||!pw)return;
  const bytes=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(encBlob.salt),iterations:encBlob.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(encBlob.iv)},key,bytes(encBlob.data));
    mergeContacts(JSON.parse(new TextDecoder().decode(pt)));
  }catch(e){toast('Wrong passphrase, or this browser cannot decrypt')}
}
const unlockForm=(label)=>`<form data-unlock class="row" style="margin:6px 0 0"><input type="password" class="unlockpw" placeholder="Contacts passphrase" autocomplete="current-password" required><button class="pri">${label||'Unlock contacts'}</button></form>`;

/* ---------- synced data (data.json, written by scripts/scrape.mjs) ---------- */
const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(KEY+k));return v??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){alert('Could not save to browser storage.')}};
const DEFAULT_TPL='Hola {name}, soy {me}. Nos toca jugar nuestro partido del ranking, antes del {deadline}. ¿Qué días y horas te vienen bien? ¡Gracias!';
const DEFAULT_TPL2='Hola {name}, soy {me}. Nos toca jugar de nuevo nuestro partido del ranking, antes del {deadline}. ¿Qué días y horas te vienen bien? ¡Gracias!';
const RESULT_EMAILS={cdc:'resultados@rankingclubdecampo.es',ccvm:'info@escuelatenisccvm.com'};   // where the winner reports the result, per ranking
const DEFAULT_RTPL='Hola, he ganado contra {opponent} y el resultado fue {score}. Gracias';
let encBlob=null;
let plans=lsGet('.plans',{}),notes=lsGet('.notes',{}),msgTpl=lsGet('.msgtpl',DEFAULT_TPL),msgTpl2=lsGet('.msgtpl2',DEFAULT_TPL2),rmail=lsGet('.rmail',{}),rtpl=lsGet('.rtpl',DEFAULT_RTPL);
let matchFocus=lsGet('.focus',{});
let focusDirty=false;
const focusDrafts={};
let check=null;                                                          // last GitHub update-run info (freshness)
let sync={upcoming:[],standings:[],groups:[],scouting:{},generated:'',status:'not loaded'};
let contacts=(()=>{try{return JSON.parse(localStorage.getItem(KEY+'.contacts'))||[]}catch(e){return[]}})();
const saveContacts=()=>{try{localStorage.setItem(KEY+'.contacts',JSON.stringify(contacts))}catch(e){alert('Could not save contacts.')}};
async function loadSync(){
  try{
    const r=await fetch('data.json?'+Date.now());if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    d.rankings.forEach(rk=>{const x=db.rankings.find(y=>y.id===rk.id);if(x){x.note=rk.note;x.sport=rk.sport;x.synced=true}else db.rankings.push({...rk,synced:true})});
    const syncedM=d.matches.map(m=>({ts:Date.parse(m.date)||0,...m,id:m.ext}));
    // A hand-entered match is dropped once the club site lists the same match: same ranking, same opponent, same result, dates within 21 days
    // (the club sites give a window-end date, so the date you typed can be a bit earlier). The official version always wins.
    const day=x=>Date.parse(x)/864e5;
    const dup=m=>m.type==='singles'&&syncedM.some(x=>x.rankingId===m.rankingId&&plain((x.opponents||[])[0])===plain((m.opponents||[])[0])&&(
      (m.planKey&&x.notes===m.notes)||(x.result===m.result&&Math.abs(day(x.date)-day(m.date))<=21)));
    const manual=db.matches.filter(m=>!m.ext),replaced=manual.filter(dup).length;
    // Preserve private reflections when the existing result reconciliation replaces a manual singles match.
    let focusMoved=false;
    manual.filter(dup).forEach(m=>{
      const old=matchFocus[focusKey(m)];if(!old)return;
      const x=syncedM.find(x=>x.rankingId===m.rankingId&&plain((x.opponents||[])[0])===plain((m.opponents||[])[0])&&((m.planKey&&x.notes===m.notes)||(x.result===m.result&&Math.abs(day(x.date)-day(m.date))<=21)));
      if(!x)return;const k=focusKey(x);
      if(!matchFocus[k]||old.updated>matchFocus[k].updated)matchFocus[k]=old;
      delete matchFocus[focusKey(m)];focusMoved=true;
    });
    if(focusMoved)lsSet('.focus',matchFocus);
    db.matches=manual.filter(m=>!dup(m)).concat(syncedM);
    (d.groups||[]).forEach(g=>g.players.forEach((q,i)=>{if(!q.rank)q.rank=i+1}));   // rank = place in the table order (the club's position field can tie)
    sync={upcoming:d.upcoming||[],standings:d.standings||[],groups:d.groups||[],scouting:d.scouting||{},generated:d.generated,status:'ok',player:d.player,replaced};
    save();
  }catch(e){sync.status='no data.json ('+e.message+')'}
  render();
  if(sync.replaced)toast(`${sync.replaced} hand-entered match${sync.replaced===1?'':'es'} replaced by the official result`);
}

/* ---------- stats ---------- */
function parseScore(s){
  const o={sw:0,sl:0,gw:0,gl:0};
  String(s||'').replace(/\(\d+\)/g,'').split(/[\s,;]+/).forEach(t=>{
    const m=t.match(/^(\[?)(\d+)-(\d+)\]?$/);if(!m)return;
    const a=+m[2],b=+m[3];
    if(a>b)o.sw++;else if(b>a)o.sl++;
    if(!m[1]&&Math.max(a,b)<10){o.gw+=a;o.gl+=b}   // [1-0] or 10+ = match tiebreak, not counted as games
  });
  return o;
}
function stats(ms){
  const s={p:ms.length,w:0,l:0,sw:0,sl:0,gw:0,gl:0};
  ms.forEach(m=>{m.result==='W'?s.w++:s.l++;const x=parseScore(m.score);s.sw+=x.sw;s.sl+=x.sl;s.gw+=x.gw;s.gl+=x.gl});
  s.pct=s.p?s.w/s.p:0;return s;
}
const asc=ms=>[...ms].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)||String(a.id).localeCompare(String(b.id)));
const desc=ms=>asc(ms).reverse();
const rankOf=m=>db.rankings.find(r=>r.id===m.rankingId)||{name:'(deleted)',sport:'tennis'};
const visible=()=>db.matches.filter(m=>ui.sport==='all'||rankOf(m).sport===ui.sport);
function streak(ms){const a=desc(ms);if(!a.length)return '–';let n=0;for(const m of a){if(m.result===a[0].result)n++;else break}return a[0].result+n}
const chips=(ms,n=10)=>desc(ms).slice(0,n).reverse().map(m=>`<span class="chip ${m.result}">${m.result}</span>`).join(' ');
const plain=n=>String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const oppKey=plain;
function groupOpponents(ms){
  const map=new Map();

const matchLabel=m=>(m.type==='doubles'?`${esc(m.partner||'?')} & me vs `:'')+(m.opponents||[]).filter(Boolean).map(n=>`<a href="#/opponents/${encodeURIComponent(n.trim())}">${esc(n)}</a>`).join(' & ');

/* ---------- charts (inline SVG) ---------- */
function rollingChart(ms){
  const a=asc(ms);if(a.length<3)return '<div class="mute small">Need at least 3 matches for a trend.</div>';
  const W=640,H=190,L=34,R=8,T=8,B=22,pw=W-L-R,ph=H-T-B;
  const X=i=>L+(a.length===1?0:i/(a.length-1)*pw),Y=v=>T+(1-v)*ph;
  let w=0;const cum=a.map((m,i)=>{if(m.result==='W')w++;return [X(i),Y(w/(i+1))]});
  const roll=a.map((m,i)=>{const sl=a.slice(Math.max(0,i-9),i+1);return [X(i),Y(sl.filter(x=>x.result==='W').length/sl.length)]});
  const path=p=>p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  const grid=[0,.5,1].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(v)+4}" text-anchor="end">${v*100}%</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Win rate trend">${grid}
    <path d="${path(cum)}" fill="none" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="${path(roll)}" fill="none" stroke="var(--win)" stroke-width="2.5"/>
    <text x="${L}" y="${H-5}">${esc(a[0].date)}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${esc(a[a.length-1].date)}</text></svg>
    <div class="legend"><span><i style="background:var(--win)"></i>Last 10 matches</span><span><i style="background:var(--mute)"></i>Overall to date</span></div>`;
}
function monthlyChart(ms){
  if(!ms.length)return '';
  const by={};ms.forEach(m=>{const k=m.date.slice(0,7);(by[k]=by[k]||{w:0,l:0})[m.result==='W'?'w':'l']++});
  const keys=Object.keys(by).sort();
  const all=[];let [y,mo]=keys[0].split('-').map(Number);const [ey,em]=keys[keys.length-1].split('-').map(Number);
  while(y<ey||(y===ey&&mo<=em)){all.push(y+'-'+String(mo).padStart(2,'0'));if(++mo>12){mo=1;y++}}
  const W=640,H=190,L=26,R=8,T=8,B=24,pw=W-L-R,ph=H-T-B;
  const max=Math.max(...all.map(k=>(by[k]?by[k].w+by[k].l:0)),1);
  const bw=Math.min(36,pw/all.length*.7),step=pw/all.length;
  const bars=all.map((k,i)=>{
    const d=by[k]||{w:0,l:0},x=L+step*i+(step-bw)/2,hw=d.w/max*ph,hl=d.l/max*ph;
    const lab=all.length<=14||i%Math.ceil(all.length/12)===0?`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle">${k.slice(2).replace('-','/')}</text>`:'';
    return `<rect x="${x}" y="${T+ph-hw}" width="${bw}" height="${hw}" fill="var(--win)"><title>${k}: ${d.w}W ${d.l}L</title></rect>
      <rect x="${x}" y="${T+ph-hw-hl}" width="${bw}" height="${hl}" fill="var(--loss)"><title>${k}: ${d.w}W ${d.l}L</title></rect>${lab}`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Matches per month">
    <line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="var(--line)"/>
    <text x="${L-5}" y="${T+8}" text-anchor="end">${max}</text>${bars}</svg>
    <div class="legend"><span><i style="background:var(--win)"></i>Wins</span><span><i style="background:var(--loss)"></i>Losses</span></div>`;
}

/* ---------- contacts + next match ---------- */
function findContact(name){
  const t=plain(name).split(' ').filter(w=>w.length>1&&!['de','del','la','las','los','y','da','van','von'].includes(w));
  if(!t.length)return null;
  let best=null,bs=0;
  contacts.forEach(c=>{const ct=new Set(plain(c.name).split(' '));const hit=t.filter(w=>ct.has(w)).length;
    const s=hit/t.length;if(hit>=2&&s>bs||hit>=1&&t.length===1&&s>bs){bs=s;best=c}});
  return bs>=.6?best:null;
}
function waLink(phone){let d=String(phone).replace(/[^\d+]/g,'');if(d.startsWith('00'))d='+'+d.slice(2);if(!d.startsWith('+'))d='+34'+d;return 'https://wa.me/'+d.replace('+','')}
const STATUS=[['','Not contacted yet'],['contacted','Contacted, waiting for a reply'],['agreed','Date agreed'],['played','Played, result still to report']];
const planKey=u=>`${u.rankingId}|${u.label}|${plain(u.opponent)}`;
const fmtDate=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';
const daysLeft=d=>d?Math.ceil((new Date(d)-new Date(today()))/864e5):null;
function msgText(u){
  const first=u.opponent.split(' ')[0],me=(sync.player||'').split(' ')[0]||'';
  const k=oppKey(u.opponent),again=db.matches.some(m=>(m.opponents||[]).some(n=>oppKey(n)===k));   // played them before -> warmer message
  return (again?msgTpl2:msgTpl).replace(/\{name\}/g,first).replace(/\{me\}/g,me).replace(/\{label\}/g,u.label).replace(/\{deadline\}/g,u.deadline?fmtDate(u.deadline):'la fecha límite');
}
function visibleUpcoming(){return sync.upcoming.filter(u=>ui.sport==='all'||(db.rankings.find(r=>r.id===u.rankingId)||{}).sport===ui.sport)}
function reminders(){
  const sched=visibleUpcoming().filter(u=>u.scheduled&&(plans[planKey(u)]||{}).status!=='played').map(u=>`<div class="card">📅 <b>${esc(u.opponent==='Por emparejar'?'Pairing pending':u.opponent)}</b> · scheduled <b>${new Date(u.scheduled).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'2-digit'})}, ${u.scheduled.slice(11,16)}</b> · ${esc(u.label)}</div>`).join('');
  return sched+visibleUpcoming().filter(u=>!u.scheduled).filter(u=>{const d=daysLeft(u.deadline);return d!==null&&d<=3&&(plans[planKey(u)]||{}).status!=='played'}).map(u=>{
    const d=daysLeft(u.deadline),p=plans[planKey(u)]||{},st=(STATUS.find(x=>x[0]===(p.status||''))||[])[1];
    return `<div class="card alert">⏰ <b>${esc(u.opponent)}</b>: ${d<0?`play-by date passed ${-d} day${d===-1?'':'s'} ago`:d===0?'play-by date is <b>today</b>':`<b>${d} day${d===1?'':'s'}</b> left to play`} (${fmtDate(u.deadline)}).
      <span class="mute small">${esc(st)}${p.status==='agreed'&&p.when?' · '+esc(p.when.replace('T',' ')):''}</span></div>`}).join('');
}
const hhmm=(when,plusMin)=>{const [h,m]=when.split('T')[1].split(':').map(Number),t=(h*60+m+plusMin)%1440;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const matchMinutes=u=>((db.rankings.find(r=>r.id===u.rankingId)||{}).sport==='padel')?90:120;   // tennis courts are booked for 2 hours
const resultTo=id=>rmail[id]??RESULT_EMAILS[id]??'';
function resultMail(u,p){
  const to=resultTo(u.rankingId),raw=String(p.score||'').trim();
  const score=u.rankingId==='cdc'?raw.replace(/(\d)\s*-\s*(\d)/g,'$1/$2'):raw;       // the Club de Campo writes sets as 6/3
  const body=rtpl.replace(/\{opponent\}/g,u.opponent).replace(/\{score\}/g,score).replace(/\{label\}/g,u.label).replace(/\{me\}/g,sync.player||'');
  return {to,body,href:`mailto:${to}?subject=${encodeURIComponent('Resultado '+u.label)}&body=${encodeURIComponent(body)}`};
}
function syncPlanMatch(u){                                                // a result you entered counts in your stats straight away
  const k=planKey(u),p=plans[k]||{},id='plan:'+k;
  db.matches=db.matches.filter(m=>m.id!==id);
  if(p.status==='played'&&(p.outcome==='lost'||(p.outcome==='won'&&p.score))){
    db.matches.push({id,planKey:k,ts:Date.now(),date:p.when?p.when.slice(0,10):today(),rankingId:u.rankingId,type:'singles',partner:'',opponents:[u.opponent],
      score:(p.score||'').trim(),result:p.outcome==='won'?'W':'L',notes:u.label});
  }
  save();
}
function resultBlock(u,p){
  if(p.status!=='played')return '';
  const out=p.outcome||'',i=sync.upcoming.indexOf(u);
  let h=`<label>How did it go?</label><select data-plan="outcome"><option value="">Choose…</option><option value="won" ${out==='won'?'selected':''}>I won</option><option value="lost" ${out==='lost'?'selected':''}>I lost</option></select>`;
  if(!out)return h;
  h+=`<label>Score, your games first (e.g. ${out==='won'?'6-3 6-4':'3-6 4-6'})${out==='lost'?' <span class="mute">(optional)</span>':''}</label><input data-plan="score" value="${esc(p.score||'')}" placeholder="${out==='won'?'6-3 6-4':'3-6 4-6'}" autocomplete="off">`;
  if(out==='lost')return h+`<div class="mute small" style="margin-top:6px">Only the winner reports the result, so there is nothing to send.</div>
    <div class="cbtn" style="margin-top:8px"><button class="btn" data-act="markdone" data-u="${i}">✓ Done, remove from Next up</button></div>`;
  const m=resultMail(u,p);
  return h+(!m.to?'<div class="mute small" style="margin-top:6px">No result email is set for this ranking. Add it on the <a href="#/data">Data page</a>.</div>'
      +`<div class="cbtn" style="margin-top:8px"><button class="btn" data-act="markdone" data-u="${i}">✓ Reported, remove from Next up</button></div>`

function planControls(u,i){

const isDone=u=>{const p=plans[planKey(u)]||{};return p.status==='played'&&!!p.outcome&&!!p.done};

function oppStanding(u){

function statusChip(u){
  const p=plans[planKey(u)]||{},st=p.status||'';
  if(u.scheduled&&!st)return `<span class="st agreed">Scheduled${u.opponent==='Por emparejar'?' · pairing pending':''}</span>`;

function upRow(u,single){

      ${note?`<div class="small" style="margin-top:4px">📝 ${esc(note)}</div>`:''}

function nextUp(){
  const all=visibleUpcoming();

  const sorted=ups.slice().sort((a,b)=>(a.deadline||'9').localeCompare(b.deadline||'9')||(a.jornada||0)-(b.jornada||0)||a.opponent.localeCompare(b.opponent));
  const rids=[...new Set(sorted.map(u=>u.rankingId))];
  return `<div class="card"><h2>Next up</h2>`+(sorted.length?rids.map(rid=>{
    const r=db.rankings.find(x=>x.id===rid)||{name:rid},items=sorted.filter(u=>u.rankingId===rid);
    const g=sync.groups.find(x=>x.rankingId===rid&&x.current);
    return (rids.length>1||items.length>1?`<div class="uphead">${esc(r.name)}${g?' · '+esc(g.name):''}</div>`:'')+items.map(u=>upRow(u,sorted.length===1)).join('');

function scoutBlock(name,u){
  const sc=sync.scouting[plain(name)];
  if(!sc||!sc.matches.length)return '<p class="mute small">No recent results found for this player yet.</p>';
  const ms=sc.matches,w=ms.filter(m=>m.result==='W').length;
  let three=0,straight=0,gw=0,gl=0;
  ms.forEach(m=>{const x=parseScore(m.score);gw+=x.gw;gl+=x.gl;if(x.sw+x.sl>=3)three++;if(m.result==='W'&&x.sl===0&&x.sw>0)straight++});
  const first=ms[ms.length-1].theirPos,now=sc.pos||ms[0].theirPos;
  const trend=first&&now?(now<first?`climbing: #${first} → #${now}`:now>first?`slipping: #${first} → #${now}`:`holding at #${now}`):'';
  return `<div class="small">
    <div style="margin:6px 0"><b>${esc(name.split(' ')[0])}</b>${sc.pos?` is #${sc.pos}`:''}${trend?`, ${trend} over the last ${ms.length} matches`:''}.</div>

 }).join('')}<a class="btn" href="#/focus">After a match / focus history</a></div>`;

function pageFocus(arg){

 const draft=focusDrafts[k];
 const ref=m?{date:m.date,label:(m.opponents||[]).join(' & '),ranking:rankOf(m).name}:entry?.match,sport=m?rankOf(m).sport:entry?.sport;
 const opts=matches.map(x=>`<option value="${esc(focusKey(x))}" ${focusKey(x)===k?'selected':''}>${esc(x.date+' · '+rankOf(x).sport+' · '+(x.opponents||[]).join(' & '))}</option>`).join('');

 <div class="card"><h2>After a match</h2>${matches.length?`<label for="focusMatch">Completed match</label><select id="focusMatch">${!m&&ref?`<option selected value="${esc(k)}">${esc(ref.date+' · '+ref.label+' (saved reference)')}</option>`:''}${opts}</select>`:''}
 ${ref?`<form id="focusForm" data-key="${esc(k)}" data-sport="${esc(sport)}"><p class="mute small">${esc(ref.date)} · ${esc(ref.ranking||sport)} · ${esc(ref.label)}${entry?.workedOn?' · worked on':''}</p>
 <label for="focusWorked">What worked?</label><textarea id="focusWorked" rows="2" maxlength="2000" placeholder="Optional">${esc(draft?.worked??entry?.worked??'')}</textarea>
 <label for="focusCost">What cost points?</label><textarea id="focusCost" rows="2" maxlength="2000" placeholder="Optional">${esc(draft?.cost??entry?.cost??'')}</textarea>
 <label for="focusNext">One focus for next time</label><textarea id="focusNext" rows="2" maxlength="500" placeholder="One thing to work on, if useful">${esc(draft?.focus??entry?.focus??'')}</textarea>
 <div class="row" style="margin-top:14px"><button class="pri" type="submit">Save match focus</button>${entry?`<button type="button" class="danger" data-act="focus-delete" data-id="${esc(k)}">Delete reflection</button>`:''}</div><div id="focusSaveStatus" class="mute small" aria-live="polite">${draft?'Unsaved changes':entry?'Saved on this device.':''}</div></form>`:'<p class="mute">Log a completed match first. You can reflect as soon as you log it, without waiting for a league update.</p>'}</div>
 <div class="card"><h2>Focus history</h2>${focusEntries().filter(([id,v])=>ui.sport==='all'||v.sport===ui.sport).map(([id,v])=>`<div class="focuscarry"><b>${esc(v.sport)} · ${esc(v.match.date)}</b><div class="mute small">${esc(v.match.label)}</div>${v.focus?`<p class="focuswords">${esc(v.focus)}</p>`:'<p class="mute small">Reflection saved without a next focus.</p>'}<div class="mute small">${v.workedOn?'✓ Worked on':v.focus?'Carried forward until worked on or a newer focus is chosen':'Reflection only'}</div><a class="btn" href="#/focus/${encodeURIComponent(id)}">View / edit</a>${v.focus?` <button data-act="focus-keep" data-id="${esc(id)}">Use next time</button>`:''}</div>`).join('')||'<p class="mute small">No reflections yet.</p>'}</div>
 <p class="mute small">Saved in this browser, included in JSON export and backup code. If shared backup is configured, included in its existing private Notion backup. This is not live cross-device sync. Use Data → Back up now after notes you want to protect.</p><a href="#/matches">Back to matches</a>`;
}
document.addEventListener('submit',e=>{
 if(e.target.id!=='focusForm')return;e.preventDefault();
 const form=e.target,k=form.dataset.key,old=matchFocus[k],m=db.matches.find(x=>focusKey(x)===k);
 const worked=$('#focusWorked').value.trim(),cost=$('#focusCost').value.trim(),focus=$('#focusNext').value.trim();
 if(!worked&&!cost&&!focus){toast('Add a reflection or use Delete to remove an old one.');return}
 const changed=focus!==(old?.focus||''),now=Date.now();
 const match=m?{date:m.date,label:(m.opponents||[]).join(' & '),ranking:rankOf(m).name}:old?.match;
 if(!match)return;
 if(storeFocus(k,{worked,cost,focus,sport:form.dataset.sport,match,updated:now,chosenAt:changed?now:(old?.chosenAt||now),workedOn:changed?null:(old?.workedOn||null)})){render();toast('Match focus saved ✓')}
});
document.addEventListener('input',e=>{if(e.target.closest('#focusForm')){focusDirty=true;const k=$('#focusForm').dataset.key;focusDrafts[k]={worked:$('#focusWorked').value,cost:$('#focusCost').value,focus:$('#focusNext').value};$('#focusSaveStatus').textContent='Unsaved changes'}});
document.addEventListener('change',e=>{if(e.target.id==='focusMatch'){location.hash='#/focus/'+encodeURIComponent(e.target.value)}});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||!b.dataset.act.startsWith('focus-'))return;
 const k=b.dataset.id,v=matchFocus[k];if(!v)return;
 if(b.dataset.act==='focus-delete'){if(!confirm('Delete this private reflection?'))return;if(storeFocus(k,{deleted:true,updated:Date.now()})){render();toast('Reflection deleted')}return}
 if(b.dataset.act==='focus-worked'&&storeFocus(k,{...v,workedOn:Date.now(),updated:Date.now()})){render();toast('Marked worked on')}
 if(b.dataset.act==='focus-keep'&&storeFocus(k,{...v,workedOn:null,chosenAt:Date.now(),updated:Date.now()})){render();toast('Kept for next time')}
});
window.addEventListener('beforeunload',e=>{if(focusDirty){e.preventDefault();e.returnValue=''}});

/* ---------- csv / json ---------- */
function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows;
}
const csvCell=v=>/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v;
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const CSV_HEAD='date,ranking,sport,type,partner,opponent1,opponent2,score,result,notes';
function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2){alert('No rows found.');return}
  const head=rows[0].map(h=>h.trim().toLowerCase());const col=n=>head.indexOf(n);
  if(col('date')<0||col('opponent1')<0){alert('CSV needs at least "date" and "opponent1" columns.');return}
  let n=0,bad=0;
  rows.slice(1).forEach(r=>{
    const g=k=>col(k)<0?'':(r[col(k)]||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(g('date'))||!g('opponent1')){bad++;return}
    const rname=g('ranking')||'Imported';let rk=db.rankings.find(x=>x.name.toLowerCase()===rname.toLowerCase());
    if(!rk){rk={id:uid(),name:rname,sport:g('sport').toLowerCase()==='padel'?'padel':'tennis'};db.rankings.push(rk)}
    const x=parseScore(g('score'));let res=g('result').toUpperCase().slice(0,1);
    if(res!=='W'&&res!=='L')res=x.sw>=x.sl?'W':'L';
    const type=g('type').toLowerCase()==='doubles'||g('partner')?'doubles':'singles';
    db.matches.push({id:uid(),ts:Date.now()+n,date:g('date'),rankingId:rk.id,type,partner:g('partner'),opponents:[g('opponent1'),g('opponent2')].filter(Boolean),score:g('score'),result:res,notes:g('notes')});
    n++;
  });
  save();render();alert(`Imported ${n} matches.`+(bad?` Skipped ${bad} rows (need date as YYYY-MM-DD and an opponent).`:''));
}

/* ---------- move your data to another device (copy / paste code) ---------- */
// What a backup holds: hand-entered matches and rankings, notes, match statuses, result-email settings and message wording. Never contacts.
function backupPayload(){return{v:1,app:'rankings',saved:new Date().toISOString(),manual:db.matches.filter(m=>!m.ext),rankings:db.rankings.filter(r=>!r.synced),plans,notes,matchFocus,rmail,rtpl,msgTpl,msgTpl2}}
function backupCode(){return 'RR1:'+btoa(unescape(encodeURIComponent(JSON.stringify(backupPayload()))))}
/** Adds a backup to this device: nothing here is deleted, matches already here are kept. */
function applyBackup(d){
  mergeFocus(d.matchFocus);
  (d.rankings||[]).forEach(r=>{if(!db.rankings.some(x=>x.id===r.id))db.rankings.push(r)});
  const have=new Set(db.matches.map(m=>m.id));
  d.manual.forEach(m=>{if(!have.has(m.id))db.matches.push(m)});
  plans={...plans,...(d.plans||{})};notes={...notes,...(d.notes||{})};rmail={...rmail,...(d.rmail||{})};
  rtpl=d.rtpl||rtpl;msgTpl=d.msgTpl||msgTpl;msgTpl2=d.msgTpl2||msgTpl2;
  save();lsSet('.plans',plans);lsSet('.notes',notes);lsSet('.rmail',rmail);lsSet('.rtpl',rtpl);lsSet('.msgtpl',msgTpl);lsSet('.msgtpl2',msgTpl2);
}
function restoreCode(text){
  const t=String(text||'').trim();
  if(!t.startsWith('RR1:')){alert('That is not a Racket Rankings backup code (it should start with RR1:).');return false}
  let d;try{d=JSON.parse(decodeURIComponent(escape(atob(t.slice(4).replace(/\s+/g,'')))))}catch(e){alert('The code looks incomplete or damaged. Copy it again, making sure the whole text is included.');return false}
  if(!d||!Array.isArray(d.manual)){alert('The code does not contain backup data.');return false}
  if(!confirm(`Add ${d.manual.length} hand-entered matches, ${Object.keys(d.notes||{}).length} notes and ${Object.keys(d.plans||{}).length} match statuses from the backup? Your current data stays; the backup fills in the rest.`))return false;
  applyBackup(d);
  render();return true;
}
function importContacts(text){
  const first=text.split(/\r?\n/)[0]||'';const delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':first.includes('\t')?'\t':',';
  const rows=(delim===','?parseCSV(text):text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(delim).map(x=>x.replace(/^"|"$/g,''))));
  if(rows.length<2){alert('No rows found.');return}
  const head=rows[0].map(h=>plain(h));
  const find=(...k)=>head.findIndex(h=>k.some(x=>h.includes(x)));
  let iN=find('nombre y apellidos','name','nombre','jugador','player'),iS=find('apellido','surname','last'),iP=find('movil','mobile','telefono','tel','phone'),iE=find('email','correo','mail');
  if(iN<0&&iS<0){alert('Could not find a name column. Headers seen: '+rows[0].join(', '));return}
  const out=[];
  rows.slice(1).forEach(r=>{
    const g=i=>i<0?'':String(r[i]||'').trim();
    let name=iS>=0&&iS!==iN?`${g(iN)} ${g(iS)}`.trim():g(iN);
    if(name.includes(',')){const [a,b]=name.split(',');name=`${b.trim()} ${a.trim()}`}
    const phone=g(iP),email=g(iE);
    if(name&&(phone||email))out.push({name,phone,email});
  });
  mergeContacts(out);
}
function mergeContacts(out){
  const byName=new Map(contacts.map(c=>[plain(c.name),c]));
  out.forEach(c=>byName.set(plain(c.name),{...byName.get(plain(c.name)),...c}));   // merge sources; newer import wins
  contacts=[...byName.values()];saveContacts();render();alert(`Added ${out.length} contacts (${contacts.length} stored in total).`);
}
function importPasted(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length){alert('Paste some contacts first.');return}
  if(/(nombre|name|apellid)/i.test(lines[0])&&/[,;\t]/.test(lines[0])){importContacts(text);return}   // pasted a CSV with a header row
  const out=[];
  lines.forEach(l=>{
    const email=(l.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/)||[''])[0];
    const phone=(l.match(/\+?\d[\d\s().-]{7,}\d/)||[''])[0].replace(/[^\d+]/g,'');
    let name=l.replace(email,' ').replace(/\+?\d[\d\s().-]{7,}\d/,' ').replace(/[;\t|]+/g,' ').replace(/\s+/g,' ').replace(/^[\s,.-]+|[\s,.-]+$/g,'');
    if((name.match(/,/g)||[]).length===1){const [a,b]=name.split(',');name=`${b.trim()} ${a.trim()}`}   // "Surname, Name"
    name=name.replace(/,/g,' ').replace(/\s+/g,' ').trim();
    if(name&&(phone||email))out.push({name,phone,email});
  });
  if(!out.length){alert('Could not find a name plus a phone number or email on any line.');return}
  $('#pasteC').value='';mergeContacts(out);
}

/* ---------- sample data ---------- */
function loadSample(){
  if(db.matches.length&&!confirm('Add sample data to your existing data?'))return;
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const names=['Anna Keller','Ben Fischer','Carlos Ruiz','Dana Weiss','Elias Brandt','Fiona Maier','Gabor Nagy','Hanna Roth','Ivo Novak','Jonas Huber'];
  const r1={id:uid(),name:'Club Ladder',sport:'tennis'},r2={id:uid(),name:'Regional League',sport:'tennis'},r3={id:uid(),name:'Padel Americano Series',sport:'padel'};
  db.rankings.push(r1,r2,r3);
  const strength={};names.forEach(n=>strength[n]=.25+rnd()*.5);
  const start=new Date();start.setMonth(start.getMonth()-14);
  for(let i=0;i<70;i++){
    const d=new Date(start.getTime()+i/70*(Date.now()-start.getTime()));
    const r=[r1,r2,r3][Math.floor(rnd()*3)],dbl=r.sport==='padel'||rnd()<.25;
    const o1=names[Math.floor(rnd()*names.length)];let o2=names[Math.floor(rnd()*names.length)];while(o2===o1)o2=names[Math.floor(rnd()*names.length)];
    const p=names[Math.floor(rnd()*names.length)];
    const win=rnd()>strength[o1]+(i/70)*.1;
    const sets=[];let a=0,b=0;
    while(a<2&&b<2){const w=win?rnd()<.75:rnd()<.25;const l=Math.floor(rnd()*5);if(w){a++;sets.push(l===4?'7-6':'6-'+l)}else{b++;sets.push(l===4?'6-7':l+'-6')}}
    db.matches.push({id:uid(),ts:i,date:d.toISOString().slice(0,10),rankingId:r.id,type:dbl?'doubles':'singles',partner:dbl&&p!==o1&&p!==o2?p:'',
      opponents:dbl?[o1,o2]:[o1],score:sets.join(' '),result:a>b?'W':'L',notes:''});
  }
  save();render();
}

  else if(act==='savertpl'){rtpl=$('#rtplBox').value.trim()||DEFAULT_RTPL;lsSet('.rtpl',rtpl);toast('Email text saved ✓')}
  else if(act==='resetrtpl'){rtpl=DEFAULT_RTPL;lsSet('.rtpl',rtpl);render();toast('Email text reset')}
  else if(act==='markdone'||act==='emailresult'){const u=sync.upcoming[+b.dataset.u],k=planKey(u);plans[k]={...plans[k],done:true};lsSet('.plans',plans);syncPlanMatch(u);setTimeout(render,act==='emailresult'?500:0);if(act==='markdone')toast('Moved to Done ✓')}
  else if(act==='undodone'){const u=sync.upcoming[+b.dataset.u],k=planKey(u);plans[k]={...plans[k],done:false};lsSet('.plans',plans);render()}
  else if(act==='cal-match')calMatch(sync.upcoming[+b.dataset.u]);
  else if(act==='cal-deadline')calDeadline(sync.upcoming[+b.dataset.u]);
  else if(act==='cal-book')calBooking(sync.upcoming[+b.dataset.u]);
  else if(act==='copymsg'){const t=msgText(sync.upcoming[+b.dataset.u]);
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Message copied ✓'),()=>prompt('Copy this message:',t))}
  else if(act==='clearcontacts'){if(confirm('Remove all stored contacts?')){contacts=[];saveContacts();render()}}
  else if(act==='importjson'||act==='importcsv'||act==='importcontacts'){
    const f=$('#file');f.accept=act==='importjson'?'.json':'.csv,text/csv,.txt';f.value='';
    f.onchange=()=>{const file=f.files[0];if(!file)return;const rd=new FileReader();
      rd.onload=()=>{
        if(act==='importcsv'){importCSV(String(rd.result));return}
        if(act==='importcontacts'){importContacts(String(rd.result));return}
        try{const d=JSON.parse(rd.result);if(!d.rankings||!d.matches)throw 0;
          if(confirm(`Replace current data with backup (${d.matches.length} matches)?`)){mergeFocus(d.matchFocus);plans=d.plans||plans;notes=d.notes||notes;rmail=d.rmail||rmail;rtpl=d.rtpl||rtpl;msgTpl=d.msgTpl||msgTpl;msgTpl2=d.msgTpl2||msgTpl2;lsSet('.plans',plans);lsSet('.notes',notes);lsSet('.rmail',rmail);lsSet('.rtpl',rtpl);lsSet('.msgtpl',msgTpl);lsSet('.msgtpl2',msgTpl2);db={rankings:d.rankings,matches:d.matches};save();render()}}
        catch(_){alert('That file is not a Racket Rankings backup.')}};
      rd.readAsText(file)};
    f.click();
  }
});

  const t=e.target.id;
  if(t==='mq'){ui.mSearch=e.target.value;fillMatches()}
  else if(t==='oq'){ui.oSearch=e.target.value;fillOpponents()}
});
document.addEventListener('change',e=>{

  if(e.target.dataset.plan){const u=sync.upcoming[+e.target.closest('[data-u]').dataset.u],k=planKey(u);
    const nk=e.target.dataset.plan,prevP=plans[k]||{};
    plans[k]={...prevP,[nk]:e.target.value};

  if(e.target.dataset.rmail!==undefined){rmail[e.target.dataset.rmail]=e.target.value.trim();lsSet('.rmail',rmail);toast('Email saved ✓');return}
  if(t==='oppNote'){const k=e.target.dataset.opp;if(e.target.value.trim())notes[k]=e.target.value.trim();else delete notes[k];lsSet('.notes',notes);toast('Note saved ✓');return}
  if(t==='mr'){ui.mRank=e.target.value;fillMatches()}
  else if(t==='mres'){ui.mRes=e.target.value;fillMatches()}
  else if(t==='os'){ui.oSort=e.target.value;fillOpponents()}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.tagName==='DETAILS'&&d.dataset.open!==undefined){ui.open=ui.open||{};ui.open[d.dataset.open]=d.open}},true);
document.addEventListener('submit',e=>{
  if(e.target.matches('form[data-unlock]')){e.preventDefault();const i=e.target.querySelector('input');unlockContacts(i.value);i.value='';return}
  if(e.target.id==='rkForm'){e.preventDefault();db.rankings.push({id:uid(),name:$('#rkn').value.trim(),sport:$('#rks').value});save();render()}
});
/* ---------- shared backup (Notion, through the Pocket CRM service) ---------- */
/* Shared backup client. The same code runs in My Day, Racket Rankings and Pocket CRM. Each app compresses its own data and
   sends it to the Pocket CRM service, which keeps it in the Notion database "App backups". */
const SharedBackup = (() => {
  const DEFAULT_URL = 'https://contact-capture.matthias-homan.workers.dev';
  const K = { url: 'sb.url', tok: 'sb.token', auto: 'sb.autoAt', last: 'sb.lastOk' };
  const get = (k, d = '') => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch { /* storage off */ } };
  const NAMES = { myday: 'My Day', rankings: 'Racket Rankings', crm: 'Pocket CRM' };
  const b64 = (buf) => { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const pipe = async (bytes, stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
  const api = {
    NAMES,
    url: () => (get(K.url) || DEFAULT_URL).replace(/\/+$/, ''),
    token: () => get(K.tok),
    configured: () => !!get(K.tok),
    setup(url, token) { set(K.url, (url || '').trim()); set(K.tok, (token || '').trim()); },
    lastOk: () => Number(get(K.last, '0')) || 0,
    device() { const m = /Android[^;)]*;\s*([^;)]+?)(?:\sBuild|\))/.exec(navigator.userAgent); return m && m[1] && m[1] !== 'K' ? m[1] : /Android/.test(navigator.userAgent) ? 'Android phone' : 'Browser'; },
    /** object -> "gz:<base64>" (or "raw:" when the browser cannot compress). */
    async pack(obj) {
      const bytes = new TextEncoder().encode(JSON.stringify(obj));
      if (typeof CompressionStream === 'function') return 'gz:' + b64(await pipe(bytes, new CompressionStream('gzip')));
      return 'raw:' + b64(bytes);
    },
    async unpack(str) {
      const raw = unb64(str.slice(str.indexOf(':') + 1));
      const bytes = str.startsWith('gz:') ? await pipe(raw, new DecompressionStream('gzip')) : raw;
      return JSON.parse(new TextDecoder().decode(bytes));
    },
    async call(path, init = {}) {
      let res;
      try { res = await fetch(api.url() + path, { ...init, headers: { Authorization: 'Bearer ' + api.token(), ...(init.body ? { 'Content-Type': 'application/json' } : {}) }, signal: AbortSignal.timeout(45000) }); }
      catch { throw new Error('Could not reach the Pocket CRM service. Check the signal and the address.'); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(res.status === 401 ? 'The access token is wrong. Use the same token as Pocket CRM.' : data.error || `The service said no (${res.status}).`);
      return data;
    },
    async save(app, obj) {
      const data = await api.pack(obj);
      const res = await api.call('/backup/save', { method: 'POST', body: JSON.stringify({ app, data, device: api.device() }) });
      set(K.last, String(Date.now()));
      return res.backup;
    },
    async load(app) { const r = await api.call('/backup/load?app=' + app); return { ...r, object: await api.unpack(r.data) }; },
    async list() { return (await api.call('/backup/list')).backups; },
    /** Once a day when the app is opened (and it has something to save). Silent: never throws. */
    async auto(app, makeObject) {
      if (!api.configured() || !navigator.onLine) return false;
      if (Date.now() - (Number(get(K.auto, '0')) || 0) < 20 * 3600 * 1000) return false;
      try { const o = makeObject(); if (!o) return false; set(K.auto, String(Date.now())); await api.save(app, o); return true; } catch { set(K.auto, '0'); return false; }
    },
    /** "3 hours ago" style label. */
    ago(iso) { const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000); if (!(m >= 0)) return ''; if (m < 2) return 'just now'; if (m < 90) return m + ' minutes ago'; if (m < 36 * 60) return Math.round(m / 60) + ' hours ago'; return Math.round(m / 1440) + ' days ago'; },
  };
  return api;
})();

let sb={list:null,msg:null};
async function sbRefresh(quiet){
  if(!SharedBackup.configured()){sb.list=null;return}
  try{sb.list=await SharedBackup.list();if(!quiet)sb.msg={ok:true,text:'Connected.'}}catch(e){sb.list=null;sb.msg={ok:false,text:e.message}}
  render();
}
function sbCard(){
  const rows=SharedBackup.configured()?'<div class="mute small" style="margin-top:10px">'+Object.entries(SharedBackup.NAMES).map(([k,n])=>{const b=(sb.list||[]).find(x=>x.app===k);const old=!b||Date.now()-new Date(b.at).getTime()>7*864e5;return `<div style="margin:2px 0;${old&&sb.list?'color:var(--warn,#b45309)':''}"><b>${n}</b>: ${sb.list?(b?esc(SharedBackup.ago(b.at))+' · '+b.size_kb+' KB'+(b.device?' · '+esc(b.device):''):'no backup yet'):'…'}</div>`}).join('')+'</div>':'';
  return `<div class="card"><h2>Shared backup (Notion)</h2>
  <p class="mute small">Saves your hand-entered matches, notes, match focus, match statuses and settings (not contacts) into the Notion database <b>App backups</b> through your Pocket CRM service, next to the backups of My Day and Pocket CRM. It backs up by itself once a day when you open the app.</p>
  <label for="sbUrl">Pocket CRM address</label><input id="sbUrl" value="${esc(SharedBackup.url())}" autocomplete="off" autocapitalize="off">
  <label for="sbTok">Pocket CRM access token</label><input id="sbTok" type="password" value="${esc(SharedBackup.token())}" placeholder="the same token as in Pocket CRM" autocomplete="off">
  <div class="row" style="margin-top:8px"><button class="pri" data-act="sbsave">Back up now</button><button data-act="sbrestore">Restore</button><button data-act="sbcheck">Check</button></div>
  ${sb.msg?`<div class="mute small" style="margin-top:8px;${sb.msg.ok?'':'color:var(--bad,#b91c1c)'}">${esc(sb.msg.text)}</div>`:''}${rows}</div>`;
}
SharedBackup.auto('rankings',()=>db.matches.some(m=>!m.ext)||Object.keys(notes).length||Object.keys(plans).length||Object.keys(matchFocus).length?backupPayload():null);
